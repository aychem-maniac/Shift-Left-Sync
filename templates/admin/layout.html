<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Shift-Left-Sync Admin{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="admin-header">
    <div class="admin-header-inner">
      <div class="brand-row">
        <h1>Shift-Left-Sync Admin</h1>
        <span class="admin-badge">ADMIN</span>
      </div>
      <nav class="admin-nav" aria-label="관리자 메뉴">
        <a class="{{ 'active' if active_menu == 'home' else '' }}" href="/admin">Home</a>
        <a class="{{ 'active' if active_menu == 'pending' else '' }}" href="/admin/pending">승인 대기</a>
        <a class="{{ 'active' if active_menu == 'users' else '' }}" href="/admin/users">유저 관리</a>
        <a class="{{ 'active' if active_menu == 'history' else '' }}" href="/admin/history">히스토리</a>
        <a class="{{ 'active' if active_menu == 'security' else '' }}" href="/admin/security">보안 이벤트</a>
        <a href="/dashboard">스캔 화면</a>
        <a href="/auth/logout">로그아웃</a>
      </nav>
    </div>
  </header>
  <main class="admin-main">
    {% block admin_content %}{% endblock %}
  </main>
  <script src="/static/js/admin.js"></script>
</body>
</html>
