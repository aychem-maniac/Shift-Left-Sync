# Shift-Left-Sync project-specific WAF rules.

SecRule REQUEST_METHOD "@streq CONNECT" \
  "id:1001100,phase:1,deny,status:403,log,auditlog,msg:'SLS bot block: CONNECT method'"

SecRule REQUEST_URI "@rx (?i)^/(?:\.env|\.git/config|config\.json|HNAP1|mcp|mcp-sse|sse|metrics|nmaplowercheck|Trinity\.txt|evox/about)(?:$|[/?#])" \
  "id:1001101,phase:1,deny,status:403,log,auditlog,msg:'SLS bot block: sensitive scanner path'"

SecRule REQUEST_URI "@rx (?i)^/\.well-known/security\.txt(?:$|[/?#])" \
  "id:1001102,phase:1,deny,status:403,log,auditlog,msg:'SLS bot block: security.txt probe'"
